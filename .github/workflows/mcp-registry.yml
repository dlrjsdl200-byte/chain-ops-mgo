name: Publish to MCP Registry

# Updates io.github.dlrjsdl200-byte/mgo-mcp-server from server.json using
# GitHub OIDC (no stored credentials). Run after the npm package is live.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Check the npm version in server.json is published
        run: |
          V=$(node -p "require('./server.json').packages[0].version")
          curl -sf "https://registry.npmjs.org/chain-ops-mgo/$V" > /dev/null || { echo "chain-ops-mgo@$V not on npm yet"; exit 1; }
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish